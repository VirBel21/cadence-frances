<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>Ejecutando pruebas…</title>
<style>body{font:15px/1.5 system-ui,sans-serif;padding:20px;max-width:900px;margin:0 auto}li{margin:4px 0}.ok{color:#1b6b3a}.ko{color:#b00020;font-weight:600}iframe{width:100%;height:760px;border:1px solid #ccc;margin-top:16px}</style></head>
<body>
<h1>Pruebas de Cadence</h1>
<p>Recorre la página real en el marco de abajo. Guarda y restaura tu progreso, así que no lo altera.</p>
<ul id="out"></ul>
<iframe id="f" src="index.html" title="Cadence"></iframe>
<script>
(function(){
var KEY='cadence.fr.v1',out=document.getElementById('out'),f=document.getElementById('f'),fails=0,backup=null;
try{backup=localStorage.getItem(KEY)}catch(e){}
function log(ok,msg){var li=document.createElement('li');li.className=ok?'ok':'ko';li.textContent=(ok?'PASS  ':'FAIL  ')+msg;out.appendChild(li);if(!ok)fails++}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function q(s){return f.contentDocument.querySelector(s)}
function qa(s){return f.contentDocument.querySelectorAll(s)}
async function click(s){var e=q(s);if(!e){return false}e.click();await sleep(250);return true}
async function run(){
  await sleep(800);
  var d=f.contentDocument;
  log(/Cadence/.test(d.title),'El título de la página contiene «Cadence»');
  log(qa('[data-a="tab"]').length===8,'El menú tiene 8 secciones');
  log(/Bonjour/.test((q('#v-home h1')||{}).textContent||''),'Empezar: muestra «Bonjour.»');
  log(qa('#v-home .stage').length===3,'Empezar: principio, desarrollo y final');
  log(/90 y 100 horas/.test(q('#v-home').textContent),'Empezar: cita la referencia de horas');
  log(qa('#v-home .how li').length===4,'Empezar: el día tiene 4 pasos');
  await click('[data-a="tab"][data-t="route"]');
  log(qa('#v-route .trow').length===32,'Ruta: 32 sesiones (unidades 1 a 4)');
  log(qa('#v-route li.plan').length===0,'Ruta: no quedan sesiones solo planificadas');
  await click('#v-route [data-a="day"][data-n="1"]');
  log(qa('#v-today .stp button').length===4,'Hoy: 4 pasos');
  log(qa('#v-today .story .sl').length===6,'Sesión 1: la historia tiene 6 líneas');
  await click('#v-today [data-a="es"]');
  log(qa('#v-today .story .sense').length===6,'Día 1: se muestra el sentido en español');
  await click('#v-today [data-a="lstart"]');
  log(qa('#v-today #listen .chips .chip').length>=5,'Escucha y marca: aparecen palabras para marcar');
  await click('#v-today #listen [data-a="lpick"]');
  await click('#v-today [data-a="lcheck"]');
  log(!!q('#v-today #listen .line')&&qa('#v-today #listen .chip.ok,#v-today #listen .chip.ko,#v-today #listen .chip.miss').length>0,'Escucha y marca: comprueba y muestra la frase');
  for(var l=0;l<3;l++){await click('#v-today [data-a="lnext"]');if(l<2)await click('#v-today [data-a="lcheck"]')}
  log(/palabras reconocidas/.test(q('#v-today #listen').textContent),'Escucha y marca: resultado final');
  await click('#v-today [data-a="stepdone"][data-i="0"]');
  log(qa('#v-today .ph').length===5,'Día 1: 5 frases clave');
  await click('#v-today [data-a="stepdone"][data-i="1"]');
  await click('#v-today [data-a="start"]');
  log(qa('#v-today [data-a="pick"]').length===3,'Escena: cada turno ofrece 3 opciones');
  for(var k=0;k<3;k++){await click('#v-today [data-a="pick"]');await click('#v-today [data-a="next"]')}
  log(!!q('#v-today .endbox'),'Escena: termina con resultado');
  await click('#v-today [data-a="step"][data-i="3"]');
  await click('#v-today [data-a="dayrv"]');
  for(var m=0;m<5;m++){await click('#v-review [data-a="show"]');await click('#v-review [data-a="rate"][data-r="1"]')}
  log(!!q('#v-review [data-a="backday"]'),'Dilo tú: al acabar vuelve al día');
  await click('#v-review [data-a="backday"]');
  log(/Día 1 completo/.test(q('#v-today').textContent),'Día 1 queda completo');
  await click('[data-a="tab"][data-t="route"]');
  log(qa('#v-route .node.done').length===1,'Ruta: el día 1 aparece como Hecho');
  await click('#v-route [data-a="day"][data-n="7"]');
  await click('#v-today [data-a="qstart"]');
  log(qa('#v-today .qopt').length===3,'Mini-prueba: 3 opciones');
  for(var n2=0;n2<8;n2++){await click('#v-today .qopt');await click('#v-today [data-a="qnext"]')}
  log(/\/ 8/.test(q('#v-today').textContent),'Mini-prueba: muestra resultado sobre 8');
  await click('#v-route [data-a="day"][data-n="8"]');
  log(!!q('#v-today .checks'),'Día 7: lista de balance');
  await click('#v-route [data-a="day"][data-n="9"]');
  log(qa('#v-today .story .sl').length===8,'U2 sesión 9: la historia tiene 8 líneas');
  log(/Unidad 2 · Sesión 1 de 8/.test(q('#v-today').textContent),'U2: encabezado de unidad y sesión');
  await click('#v-today [data-a="stepdone"][data-i="0"]');
  log(qa('#v-today .ph').length===5,'U2 sesión 9: 5 frases clave');
  await click('#v-today [data-a="stepdone"][data-i="1"]');
  await click('#v-today [data-a="start"]');
  for(var k2=0;k2<3;k2++){await click('#v-today [data-a="pick"]');await click('#v-today [data-a="next"]')}
  log(!!q('#v-today .endbox'),'U2 escena: termina con resultado');
  for(var dd=10;dd<=13;dd++){
    await click('[data-a="tab"][data-t="route"]');
    await click('#v-route [data-a="day"][data-n="'+dd+'"]');
    log(qa('#v-today .story .sl').length>=7&&!!q('#v-today .stp'),'U2 sesión '+dd+': historia y 4 pasos');
  }
  await click('[data-a="tab"][data-t="route"]');
  await click('#v-route [data-a="day"][data-n="14"]');
  log(qa('#v-today .story .sl').length===8,'U2 jornada: 8 líneas');
  await click('#v-today [data-a="stepdone"][data-i="0"]');
  log(qa('#v-today .ph').length===25,'U2 jornada: 25 frases de la unidad');
  await click('[data-a="tab"][data-t="route"]');
  await click('#v-route [data-a="day"][data-n="15"]');
  await click('#v-today [data-a="qstart"]');
  for(var n3=0;n3<8;n3++){await click('#v-today .qopt');await click('#v-today [data-a="qnext"]')}
  log(/\/ 8/.test(q('#v-today').textContent),'U2 mini-prueba: resultado sobre 8');
  await click('[data-a="tab"][data-t="route"]');
  await click('#v-route [data-a="day"][data-n="16"]');
  log(qa('#v-today .checks li').length===4&&/billete/.test(q('#v-today .checks').textContent),'U2 balance: objetivos de la unidad 2');
  for(var u3=17;u3<=22;u3++){
    await click('[data-a="tab"][data-t="route"]');
    await click('#v-route [data-a="day"][data-n="'+u3+'"]');
    log(qa('#v-today .story .sl').length>=8&&!!q('#v-today .stp')&&/Unidad 3/.test(q('#v-today').textContent),'U3 sesión '+u3+': historia, pasos y unidad');
    if(u3===17){
      await click('#v-today [data-a="stepdone"][data-i="0"]');await click('#v-today [data-a="stepdone"][data-i="1"]');
      await click('#v-today [data-a="start"]');
      log(qa('#v-today [data-a="pick"]').length===3,'U3 escena: 3 opciones');
    }
    if(u3===22){await click('#v-today [data-a="stepdone"][data-i="0"]');log(qa('#v-today .ph').length===25,'U3 jornada: 25 frases');}
  }
  await click('[data-a="tab"][data-t="route"]');
  await click('#v-route [data-a="day"][data-n="23"]');
  await click('#v-today [data-a="qstart"]');
  for(var n4=0;n4<8;n4++){await click('#v-today .qopt');await click('#v-today [data-a="qnext"]')}
  log(/\/ 8/.test(q('#v-today').textContent),'U3 mini-prueba: resultado sobre 8');
  await click('[data-a="tab"][data-t="route"]');
  await click('#v-route [data-a="day"][data-n="24"]');
  log(qa('#v-today .checks li').length===4&&/restaurante/.test(q('#v-today .checks').textContent),'U3 balance: objetivos de la unidad 3');
  for(var u4=25;u4<=30;u4++){
    await click('[data-a="tab"][data-t="route"]');
    await click('#v-route [data-a="day"][data-n="'+u4+'"]');
    log(qa('#v-today .story .sl').length>=7&&!!q('#v-today .stp')&&/Unidad 4/.test(q('#v-today').textContent),'U4 sesión '+u4+': historia, pasos y unidad');
    if(u4===25){
      await click('#v-today [data-a="stepdone"][data-i="0"]');await click('#v-today [data-a="stepdone"][data-i="1"]');
      await click('#v-today [data-a="start"]');
      log(qa('#v-today [data-a="pick"]').length===3,'U4 escena: 3 opciones');
    }
    if(u4===30){await click('#v-today [data-a="stepdone"][data-i="0"]');log(qa('#v-today .ph').length===25,'U4 jornada: 25 frases');}
  }
  await click('[data-a="tab"][data-t="route"]');
  await click('#v-route [data-a="day"][data-n="31"]');
  await click('#v-today [data-a="qstart"]');
  for(var n5=0;n5<8;n5++){await click('#v-today .qopt');await click('#v-today [data-a="qnext"]')}
  log(/\/ 8/.test(q('#v-today').textContent),'Prueba final: resultado sobre 8');
  await click('[data-a="tab"][data-t="route"]');
  await click('#v-route [data-a="day"][data-n="32"]');
  log(qa('#v-today .checks li').length===4&&/cita/.test(q('#v-today .checks').textContent),'U4 balance: objetivos de la unidad 4');
  await click('[data-a="tab"][data-t="sounds"]');
  log(qa('#v-sounds .snd').length>=7,'Sonidos: al menos 7 sonidos');
  log(qa('#v-sounds #lib .lex').length===14&&qa('#v-sounds #lib .arc').length===14,'Enlaces: 14 ejemplos con arco');
  await click('#v-sounds [data-a="lqstart"]');
  for(var z=0;z<8;z++){await click('#v-sounds #lq [data-a="lqans"]');await click('#v-sounds #lq [data-a="lqnext"]')}
  log(/\/ 8/.test(q('#v-sounds #lq').textContent),'Enlaces: prueba con resultado sobre 8');
  await click('[data-a="tab"][data-t="review"]');
  log(!!q('#v-review .boxes'),'Repaso: muestra las cajas de memoria');
  await click('[data-a="tab"][data-t="words"]');
  log(qa('#v-words .wrow').length>=50,'Palabras: lista con rango de frecuencia');
  await click('#v-words [data-a="wstart"]');
  log(!!q('#v-words [data-a="wshow"]'),'Palabras: la práctica empieza');
  await click('#v-words [data-a="wshow"]');
  log(qa('#v-words [data-a="wrate"]').length===3,'Palabras: 3 valoraciones');
  await click('[data-a="tab"][data-t="verbs"]');
  log(qa('#v-verbs .vmap g[data-a="say"]').length===6&&qa('#v-verbs .vm .r').length===6,'Verbos: mapa y matriz con 6 formas');
  await click('#v-verbs [data-a="verb"][data-id="habiter"]');
  log(/j’habite/.test(q('#v-verbs').textContent),'Verbos: habiter usa j’');
  await click('#v-verbs [data-a="tense"][data-id="pc"]');
  log(/j’ai habité/.test(q('#v-verbs').textContent)&&/he vivido/.test(q('#v-verbs').textContent),'Mapas: pasado con traducción');
  await click('#v-verbs [data-a="verb"][data-id="aller"]');
  log(/suis allé/.test(q('#v-verbs').textContent)&&/he ido/.test(q('#v-verbs').textContent),'Mapas: aller usa être');
  await click('#v-verbs [data-a="tense"][data-id="fut"]');
  log(/vais aller/.test(q('#v-verbs').textContent)&&/voy a ir/.test(q('#v-verbs').textContent),'Mapas: futuro cercano');
  await click('#v-verbs [data-a="verb"][data-id="être"]');
  await click('#v-verbs [data-a="tense"][data-id="pres"]');
  log(/soy \/ estoy/.test(q('#v-verbs').textContent),'Mapas: être presente');
  await click('#v-verbs [data-a="mapmode"][data-id="ask"]');
  log(qa('#v-verbs .vmap g[data-a="say"]').length===6&&qa('#v-verbs .vm .r').length===6&&/¿Dónde está la estación\?/.test(q('#v-verbs').textContent),'Mapas: para preguntar');
  await click('#v-verbs [data-a="mapmode"][data-id="num"]');
  log(qa('#v-verbs .vm .r').length===21&&/vingt/.test(q('#v-verbs').textContent),'Mapas: números del 0 al 20');
  await click('#v-verbs [data-a="mapmode"][data-id="img"]');
  log(qa('#v-verbs .pic').length===46&&!!q('#v-verbs .pic img'),'Imágenes: galería con dibujos');
  await click('#v-verbs [data-a="pcat"][data-id="Comida"]');
  log(qa('#v-verbs .pic').length>=8&&qa('#v-verbs .pic').length<46,'Imágenes: filtro por categoría');
  await click('#v-verbs [data-a="pqstart"]');
  for(var y=0;y<8;y++){await click('#v-verbs .qopt');await click('#v-verbs [data-a="pqnext"]')}
  log(/\/ 8/.test(q('#v-verbs').textContent),'Imágenes: juego con resultado sobre 8');
  await click('[data-a="tab"][data-t="method"]');
  log(qa('#v-method .ev li').length===7,'Método: 7 evidencias');
  try{if(backup===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,backup)}catch(e){}
  document.title=(fails?'FAIL':'PASS')+' · Cadence';
  var h=document.createElement('h2');h.textContent=document.title;h.className=fails?'ko':'ok';document.body.insertBefore(h,out);
}
f.addEventListener('load',function(){run().catch(function(e){log(false,'Error en la prueba: '+e.message);document.title='FAIL · Cadence'})},{once:true});
})();
</script></body></html>
